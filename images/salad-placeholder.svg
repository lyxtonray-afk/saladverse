<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b5e20" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Salad Bowl Shadow & Ceramic Rim -->
  <ellipse cx="400" cy="380" rx="220" ry="80" fill="none" stroke="#2e7d32" stroke-opacity="0.1" stroke-width="12" />
  <path d="M 180 340 C 180 480, 620 480, 620 340 Z" fill="url(#bowlGrad)" filter="url(#shadow)" stroke="#c8e6c9" stroke-width="4" />

  <!-- Leafy Greens (Layers of Fresh Salad Leaves) -->
  <!-- Dark green background leaves -->
  <path d="M 230 330 C 210 240, 310 210, 340 270 C 370 210, 450 200, 470 260 C 500 220, 580 250, 560 330 Z" fill="#2e7d32" />
  <!-- Mid green vibrant leaves -->
  <path d="M 250 340 C 230 270, 330 240, 360 300 C 400 230, 480 240, 500 290 C 530 260, 590 300, 540 350 Z" fill="#4caf50" />
  <!-- Bright accent leaves -->
  <path d="M 310 320 C 330 260, 390 270, 410 310 C 430 260, 490 270, 460 330 Z" fill="#81c784" />

  <!-- Cucumber slices -->
  <g transform="translate(290, 310) rotate(-15)">
    <circle cx="0" cy="0" r="32" fill="#c8e6c9" stroke="#388e3c" stroke-width="6" />
    <circle cx="-6" cy="-4" r="3" fill="#81c784" />
    <circle cx="6" cy="-4" r="3" fill="#81c784" />
    <circle cx="0" cy="6" r="3" fill="#81c784" />
  </g>

  <g transform="translate(480, 300) rotate(20)">
    <circle cx="0" cy="0" r="34" fill="#c8e6c9" stroke="#388e3c" stroke-width="6" />
    <circle cx="-6" cy="-5" r="3" fill="#81c784" />
    <circle cx="7" cy="-3" r="3" fill="#81c784" />
    <circle cx="-1" cy="7" r="3" fill="#81c784" />
  </g>

  <!-- Cherry Tomatoes -->
  <circle cx="390" cy="340" r="24" fill="#e53935" />
  <circle cx="384" cy="334" r="6" fill="#ff8a80" />

  <circle cx="340" cy="360" r="20" fill="#d32f2f" />
  <circle cx="335" cy="355" r="5" fill="#ff8a80" />

  <circle cx="450" cy="345" r="22" fill="#e53935" />
  <circle cx="444" cy="340" r="5.5" fill="#ff8a80" />

  <!-- Bell Pepper Rings / Seeds -->
  <circle cx="420" cy="290" r="14" fill="#fbc02d" stroke="#f57f17" stroke-width="4" />
  <circle cx="280" cy="370" r="6" fill="#fff9c4" />
  <circle cx="510" cy="340" r="7" fill="#fff9c4" />
  <circle cx="370" cy="380" r="6" fill="#fff9c4" />

  <!-- SaladVerse Title Label -->
  <text x="400" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#2e7d32" text-anchor="middle" letter-spacing="1">
    SaladVerse &bull; Fresh &amp; Healthy
  </text>
</svg>
